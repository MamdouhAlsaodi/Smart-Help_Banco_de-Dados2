services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthelp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smarthelp
      POSTGRES_PASSWORD: smarthelp
      POSTGRES_DB: smarthelp
    ports:
      - "5432:5432"
    volumes:
      - smarthelp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthelp -d smarthelp"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smarthelp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smarthelp.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-smarthelp_admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smarthelp_postgres_data:
